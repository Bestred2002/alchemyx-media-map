<!-- ============================================================
     BLOCCO 3: FAQPage — IT
     Pagina: Homepage IT, /pmi
     ============================================================ -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Cos'è Alchemyx?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Alchemyx è la prima piattaforma italiana self-serve guidata da AI che permette alle PMI di pianificare ed eseguire campagne pubblicitarie multicanale — unificando radio, televisione, cinema, DOOH, social media e Google Search — con budget a partire da €2.000 e senza bisogno di un'agenzia. Sviluppata da Alchemyst LAB Srl, startup innovativa con sede a Piazza Castello 19, 20121 Milano."
      }
    },
    {
      "@type": "Question",
      "name": "Quanto costa usare Alchemyx?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Alchemyx applica una commissione del 13,98% sul budget pubblicitario investito. Non ci sono costi fissi o abbonamenti nella versione base. Il budget minimo per avviare una campagna è di €2.000. La versione Premium include reporting avanzato con un costo di abbonamento annuale."
      }
    },
    {
      "@type": "Question",
      "name": "Quali canali pubblicitari posso usare con Alchemyx?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Con Alchemyx puoi pianificare campagne su: radio (locale e nazionale), televisione addressable e CTV (connected TV), cinema, DOOH (digital out-of-home, billboard digitali), social media (Meta, TikTok, LinkedIn) e Google (Search e Display). Tutti i canali sono gestibili da un'unica interfaccia."
      }
    },
    {
      "@type": "Question",
      "name": "Quando sarà disponibile Alchemyx?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Il lancio ufficiale sul mercato italiano è previsto per il primo semestre del 2027. L'MVP sarà pronto a luglio 2026, seguito da una fase pilota a settembre 2026. Puoi richiedere l'accesso anticipato iscrivendoti alla white list su alchemyx.ai."
      }
    },
    {
      "@type": "Question",
      "name": "Alchemyx è diverso da Mediaset AdManager o Sky Advertising Manager?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sì. Mediaset AdManager e Sky Advertising Manager permettono di fare pubblicità solo sui canali delle rispettive concessionarie. Alchemyx è indipendente e aggrega tutti i canali — radio, cinema, DOOH e social — in un'unica piattaforma, senza essere legato a nessun editore specifico."
      }
    },
    {
      "@type": "Question",
      "name": "Ho bisogno di competenze tecniche per usare Alchemyx?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Alchemyx è progettata per PMI senza competenze tecniche o risorse interne dedicate alla pubblicità. Il processo è guidato passo-passo dall'AI: inserisci obiettivo, budget e target, e la piattaforma si occupa di tutto il resto."
      }
    },
    {
      "@type": "Question",
      "name": "Posso creare le creatività direttamente su Alchemyx?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sì. Alchemyx include strumenti AI per creare copy, audio, video e immagini direttamente sulla piattaforma. Puoi anche caricare creatività esistenti: l'AI le adatterà automaticamente per ogni canale e formato richiesto."
      }
    }
  ]
}
</script>
